# omarchy-fan profile: quiet  (level, down-threshold, up-threshold)
sensors:
  - tpacpi: /proc/acpi/ibm/thermal
    indices: [0]
fans:
  - tpacpi: /proc/acpi/ibm/fan
levels:
  - [0, 0, 65]
  - [1, 60, 70]
  - [2, 66, 75]
  - [3, 72, 80]
  - [5, 77, 86]
  - [7, 83, 92]
  - ["level full-speed", 88, 32767]
